<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>List Your Car • Bugdata Motors</title>
  <style>
    :root { --primary:#0a2463; --accent:#0077b6; --highlight:#ffb703; }
    body {
      font-family:system-ui,sans-serif; background:url('https://images.unsplash.com/photo-1600196598784-5e7c2e2e4a5a?auto=format&fit=crop&w=1600&q=60') no-repeat center/cover fixed;
      min-height:100vh; position:relative; color:#fff;
    }
    body::before { content:''; position:absolute; inset:0; background:rgba(0,0,0,0.6); z-index:-1; }
    main { max-width:500px; margin:3rem auto; padding:2rem; }
    h1 { text-align:center; margin-bottom:1.5rem; text-shadow:0 2px 4px rgba(0,0,0,0.5); }
    form {
      background:rgba(255,255,255,0.92); border-radius:12px; padding:2rem; color:#333;
      box-shadow:0 8px 24px rgba(0,0,0,0.4);
    }
    input { width:100%; padding:1rem; margin:0.5rem 0; border:1px solid #ddd; border-radius:6px; }
    button {
      width:100%; background:var(--primary); color:#fff; border:none; padding:1rem;
      border-radius:6px; font-weight:600; cursor:pointer; transition:.3s; margin-top:1rem;
    }
    button:hover { background:var(--accent); }
    .back { text-align:center; margin-top:1rem; }
    .back a { color:var(--primary); text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <h1>List Your Car</h1>
    <form id="form">
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <p style="color:#666;font-size:0.85rem;">
        By submitting, you agree to list your vehicle for buy/sell/rental.
      </p>
      <button type="submit">Continue Listing</button>
    </form>
    <div class="back"><a href="index.html">← Back to Browse</a></div>
  </main>

  <script src="api.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      // Send to Supabase
      const r = await fetch(`${SUPABASE_URL}/rest/v1/seller_requests`, {
        method:'POST', headers:{apikey: SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, 'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
      alert('✅ Listing request received! We’ll contact you shortly.');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
